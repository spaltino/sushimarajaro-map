<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>모바일 확인용 임시 프리뷰 (390px)</title>
<style>
  body{margin:0;padding:10px;background:#e9e7e2;font-family:system-ui,sans-serif}
  .row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .ph{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .cap{font-size:11px;font-weight:700;color:#444;margin:0 0 5px 2px}
  iframe{border:0;display:block;width:390px;height:900px}
</style>
</head>
<body>
  <div class="row">
    <div class="ph">
      <p class="cap">① #tsushima (390×900)</p>
      <iframe src="https://spaltino.github.io/sushimarajaro-map/#tsushima" title="tsushima mobile"></iframe>
    </div>
    <div class="ph">
      <p class="cap">② #shanghai-relay (390×900)</p>
      <iframe src="https://spaltino.github.io/sushimarajaro-map/#shanghai-relay" title="relay mobile"></iframe>
    </div>
    <div class="ph">
      <p class="cap">③ 상하이 3곳 카드 (390×900)</p>
      <iframe src="https://spaltino.github.io/sushimarajaro-map/#cards" title="cards mobile"></iframe>
    </div>
  </div>
</body>
</html>
