<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>mobile-preview 390</title>
<style>
  html,body{margin:0;padding:0;background:#20242b;}
  body{display:grid;place-items:start center;min-height:100vh;}
  #wrap{width:390px;margin:0 auto;background:#fff;}
  iframe{display:block;width:390px;height:844px;border:0;background:#fff;}
</style>
</head>
<body>
<div id="wrap"><iframe id="m" src="./index.html"></iframe></div>
<script>
  function frame(){ return document.getElementById("m").contentWindow; }
  window.mvScroll = function (y) { var w = frame(); w.scrollTo(0, y); return w.innerWidth + "x" + w.innerHeight; };
  window.mvInfo = function () { var w = frame(); return { w: w.innerWidth, h: w.innerHeight, dpr: w.devicePixelRatio }; };
  window.mvOverflow = function () {
    var d = frame().document.documentElement;
    var wide = [];
    frame().document.querySelectorAll("body *").forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (r.right > 390.5 && r.width > 0) wide.push(el.tagName + "." + (el.className || "") + " right=" + Math.round(r.right));
    });
    return { overflow: d.scrollWidth - d.clientWidth, count: wide.length, sample: wide.slice(0, 8) };
  };
</script>
</body>
</html>
