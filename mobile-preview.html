<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>mobile-preview 390</title>
<style>
  html,body{margin:0;padding:0;background:#20242b;}
  body{display:grid;place-items:start center;min-height:100vh;}
  #wrap{width:390px;margin:0 auto;background:#fff;}
  iframe{display:block;width:390px;height:844px;border:0;background:#fff;}
</style>
</head>
<body>
<div id="wrap"><iframe id="m" src="./index.html"></iframe></div>
<script>
  window.mvScroll = function (y) {
    var w = document.getElementById("m").contentWindow;
    w.scrollTo(0, y);
    return w.innerWidth + "x" + w.innerHeight;
  };
  window.mvInfo = function () {
    var w = document.getElementById("m").contentWindow;
    return { w: w.innerWidth, h: w.innerHeight, dpr: w.devicePixelRatio };
  };
</script>
</body>
</html>
