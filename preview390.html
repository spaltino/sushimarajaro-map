<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>390px 검수 프리뷰 (임시)</title>
<style>
  html, body { margin: 0; background: #16181d; }
  .stage { display: flex; gap: 16px; padding: 12px; align-items: flex-start; }
  .col { color: #9aa0aa; font: 12px/1.4 -apple-system, sans-serif; }
  iframe { width: 390px; height: 844px; border: 0; background: #fff; border-radius: 10px; display: block; }
</style>
</head>
<body>
<div class="stage">
  <div class="col"><div id="meta">loading…</div><iframe id="f" title="site 390"></iframe></div>
</div>
<script>
(function () {
  var S_OPEN = '<' + 'script>';
  var S_CLOSE = '</' + 'scr' + 'ipt>';
  var INJECT = S_OPEN +
    'window.__errs=[];' +
    'window.addEventListener("error",function(e){window.__errs.push((e.message||"")+" @"+(e.filename||"")+":"+(e.lineno||""));});' +
    'window.addEventListener("unhandledrejection",function(e){window.__errs.push("rejection:"+((e.reason&&e.reason.message)||e.reason));});' +
    'var _ce=console.error;console.error=function(){window.__errs.push("console.error:"+Array.prototype.join.call(arguments," "));return _ce.apply(console,arguments);};' +
    S_CLOSE;

  fetch('./index.html', { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var patched = html.replace('<head>', '<head>' + INJECT);
      var f = document.getElementById('f');
      f.addEventListener('load', function () {
        setTimeout(function () { document.getElementById('meta').textContent = 'loaded'; }, 1500);
      });
      f.srcdoc = patched;
    })
    .catch(function (e) {
      document.getElementById('meta').textContent = 'fetch failed: ' + e.message;
    });
})();
</script>
</body>
</html>
