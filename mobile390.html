<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>390×844 모바일 확인용 임시 프리뷰</title>
<style>
  html,body{margin:0;padding:0;background:#e9e5df;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;}
  .wrap{display:flex;gap:16px;padding:12px;align-items:flex-start;flex-wrap:wrap;}
  .phone{width:390px;height:844px;border:1px solid #b9b2a8;border-radius:14px;overflow:hidden;background:#fff;}
  iframe{width:390px;height:844px;border:0;display:block;}
  p{font-size:12px;color:#5b554d;margin:0 0 8px;}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <p>390 × 844 · index.html (확인 후 삭제하는 임시 페이지)</p>
    <div class="phone"><iframe id="pf" src="index.html" width="390" height="844" scrolling="yes"></iframe></div>
  </div>
</div>
</body>
</html>
