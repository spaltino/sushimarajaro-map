<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>390 check</title>
<style>body{margin:0;background:#333;font:12px/1.4 system-ui;color:#fff}#wrap{width:390px;height:844px;margin:0 auto;background:#fff}iframe{width:390px;height:844px;border:0}</style>
</head><body>
<div id="wrap"><iframe id="fr" src="./index.html?cb=2026112607"></iframe></div>
<script>
window.__errs=[];
var fr=document.getElementById('fr');
fr.addEventListener('load',function(){
  try{
    fr.contentWindow.addEventListener('error',function(e){window.__errs.push('err:'+(e.message||''));});
    fr.contentWindow.addEventListener('unhandledrejection',function(e){window.__errs.push('rej:'+String(e.reason));});
  }catch(e){window.__errs.push('hookfail:'+e.message);}
});
window.__metrics=function(){
  var d=fr.contentDocument, w=fr.contentWindow;
  var de=d.documentElement;
  return {docScrollW:de.scrollWidth, docClientW:de.clientWidth, bodyScrollW:d.body.scrollWidth,
          innerW:w.innerWidth, pins:d.querySelectorAll('.leaflet-marker-icon').length,
          cards:d.querySelectorAll('.cards > *').length,
          tabs:[].map.call(d.querySelectorAll('.tab'),function(t){return t.textContent.trim();}).slice(0,4),
          errs:window.__errs};
};
window.__width=function(px){
  var wp=document.getElementById('wrap'), f=document.getElementById('fr');
  wp.style.width=px+'px'; f.style.width=px+'px';
  var d=f.contentDocument, de=d.documentElement;
  var over=[];
  [].forEach.call(d.querySelectorAll('body *'),function(el){
    var r=el.getBoundingClientRect();
    if(r.width>0 && (r.right>de.clientWidth+1)) over.push((el.tagName+'.'+(el.className||'')).slice(0,40));
  });
  return {px:px, scrollW:de.scrollWidth, clientW:de.clientWidth, overflowCount:over.length, sample:over.slice(0,5)};
};
</script></body></html>
